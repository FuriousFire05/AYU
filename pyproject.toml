[project]
name = "ayu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FuriousFire05", email = "furiousfire05@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
ayu = "ayu:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
